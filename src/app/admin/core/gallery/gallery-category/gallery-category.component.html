<div class="body-layout admin">
    <div class="row">

        <div class="col-lg-9 mb-4">
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center pt-0 pe-0">
                    <h3 class="mb-0"> Gallery Category</h3>
                    <input type="text" class="search-input form-control" style="width: 250px;"
                        placeholder="Search category..." [(ngModel)]="searchTerm" (input)="filterCategories()">
                </div>

                <div class="card-body px-0">
                    <div class="row">
                        <div class="card-table">
                            <div class="table-responsive-sm">
                                <div class="table__wrapper table__wrapper-70">
                                    <table class="table" style="width: 100%;">
                                        <thead class="table__head">
                                            <tr>
                                                <th style="width: 90px;">S.N.</th>
                                   
                                                <th>Category Name</th>
                                                <th class="text-center" style="width: 120px;">Display Order</th>
                                                <th class="text-center" style="width: 120px;">Show / Hide</th>
                                                <th style="width: 150px; text-align: right; padding-right: 20px;">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr *ngFor="let item of filteredGalleryCategoryList; let i = index">
                                                <td>{{i+1}}</td>
                                                <td>{{item.categoryName}}</td>
                                                <td class="text-center">{{item.displayOrder}}</td>
                                                <td class="text-center">
                                                    <span [class]="item.isActive ? 'text-success' : 'text-danger'">
                                                        {{item.isActive ? 'Show' : 'Hide'}}
                                                    </span>
                                                </td>
                                                <td>
                                                    <div class="d-flex gap-2 justify-content-end">
                                                        <button class="btn btn-sm btn-primary me-2"
                                                            (click)="getGalleryCategoryId(item.galleryMasterId)">
                                                            Edit
                                                        </button>
                                                        <button class="btn btn-sm btn-danger"
                                                            (click)="deleteGalleryCategory(item.galleryMasterId)">
                                                            Delete
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                            <tr *ngIf="filteredGalleryCategoryList.length === 0">
                                                <td colspan="5" class="text-center text-muted py-3">No categories found.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-3">
            <div class="card shadow-sm p-3">
                <form #MenucategoryForm="ngForm">
                    <div class="mb-3">
                        <label class="form-label">Category Name</label>
                        <input type="text" [(ngModel)]="this.service.galleryCategoryModel.categoryName"
                            name="categoryName" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Display Order</label>
                        <input type="number" [(ngModel)]="this.service.galleryCategoryModel.displayOrder"
                            name="displayOrder" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Gallery Category ( IsActive )</label>
                        <select data-placeholder="--Select--" id="isActive" name="isActive" class="form-control" style="width: 100%;">
                            <option></option>
                            <option value="true">Show</option>
                            <option value="false">Hide</option>
                        </select> 
                    </div>

                    <div class="flex-wrap gap-2 d-flex mt-4">
                        <button type="button" class="btn btn-primary flex-grow-1" (click)="saveGalleryCategory()" [disabled]="isLoading">
                            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1"></span>
                            Save Category
                        </button>
                        <button type="button" class="btn btn-secondary" (click)="reset()">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>
