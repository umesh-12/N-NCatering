<div class="body-layout admin">
    <div class="row">

        <div class="col-lg-12 mb-4">
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center pt-0 pe-0">
                    <h3 class="mb-0"> Gallery Featured</h3>
                    <input type="text" class="search-input form-control" style="width: 250px;"
                        placeholder="Search featured..." [(ngModel)]="searchTerm" (input)="filterCategories()">
                </div>

                <div class="card-body px-0">
                    <div class="row">
                        <div class="card-table">
                            <div class="table-responsive-sm">
                                <div class="table__wrapper table__wrapper-70">
                                    <table class="table" style="width: 100%;">
                                        <thead class="table__head">
                                            <tr>
                                                <th style="width: 90px;">S.N.</th>
                                                <th class="text-center" style="width: 120px;">Title</th>
                                                <th>Category Name</th>
                                                <th class="text-center" style="width: 120px;">Description</th>
                                                <th class="text-center" style="width: 120px;">Image</th>
                                                <th class="text-center" style="width: 120px;">Display Order</th>
                                                <th class="text-center" style="width: 120px;">Show / Hide</th>
                                                <th class="text-center" style="width: 120px;">Is Featured</th>

                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr *ngFor="let item of filteredGalleryFeaturedList; let i = index">
                                                <td class="text-center">{{i+1}}</td>
                                                <td>{{item.title}}</td>
                                                <td>{{item.categoryName}}</td>
                                                <td>{{item.description}}</td>
                                                <td class="text-center">
                                                    <img [src]="baseurl + item.imageUrl" [alt]="item.title" width="60"
                                                        style="border-radius: 5px; object-fit: cover;">
                                                </td>
                                                <td class="text-center">{{item.displayOrder}}</td>
                                                <td class="text-center">
                                                    <span [class]="item.isActive ? 'text-success' : 'text-danger'">
                                                        {{item.isActive ? 'Show' : 'Hide'}}
                                                    </span>
                                                </td>
                                                <td class="text-center">
                                                    <span [class]="item.isFeatured ? 'text-success' : 'text-danger'">
                                                        {{item.isFeatured ? 'Yes' : 'No'}}
                                                    </span>
                                                </td>
                                            </tr>
                                            <tr *ngIf="filteredGalleryFeaturedList.length === 0">
                                                <td colspan="5" class="text-center text-muted py-3">No featured items
                                                    found.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>


    </div>
</div>
