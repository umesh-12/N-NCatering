<section class="gallery-section m-t-60" data-aos="fade-up">
  <div class="container-fluid">

    <div *ngIf="isLoading" class="text-center my-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <section class="splide" #gallery data-aos="zoom-in" data-aos-delay="100" *ngIf="!isLoading && galleryList.length > 0">
      <div class="splide__track">
        <ul class="splide__list">

          <li *ngFor="let item of galleryList" class="splide__slide gallery-item">
            <a [href]="baseurl + item.imageUrl" data-lightbox="gallery" [attr.data-title]="item.title || 'Gallery Image'">
              <img [src]="baseurl + item.imageUrl" [alt]="item.title || 'Gallery'">
            </a>
          </li>

        </ul>
      </div>
    </section>

    <div *ngIf="!isLoading && galleryList.length === 0" class="text-center text-muted my-5">
      No images found in gallery.
    </div>

  </div>
</section>
